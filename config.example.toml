# Gap between windows and the output's top/bottom edge
vertical_gap = 9
# Gap between adjacent windows
horizontal_gap = 9
# Default proportion of the output's available width for a new window
default_window_width = 0.5

# Center the focused window (never, always, single)
center_focused_window = "never"

# Focus the window under the mouse pointer (sloppy focus)
focus_follows_pointer = false

# Disable client side decorations
no_csd = true

[border]
width = 3
focused_color = { r = 141, g = 214, b = 0, a = 1.0 }
unfocused_color = { r = 160, g = 160, b = 160, a = 1.0 }

# Theme and size of the cursor (omit to use the default cursor)
# [cursor]
# theme = "Adwaita"
# size = 24

# Commands run detached at startup. Each entry is one command + args.
# spawn_at_startup = [["awww-daemon"], ["wl-clip-persist", "--clipboard", "both"]]

# Rules matching windows by exact app_id and/or glob title (`*`, `?`).
# All set fields must match. Matched windows are forced floating.
# [[window_rules]]
# app_id = "footclient"
# floating = true
# [[window_rules]]
# title = "Picture-in-Picture"
# floating = true

# Keybindings. A present [[keybindings]] section REPLACES the built-in
# defaults as a whole - it does not merge - so either list every binding you
# want, or leave the section out to keep all defaults (the full default table
# is in README). Unknown keys are rejected at parse time.
#
#   key:       keysym name (case insensitive) from xkbcommon-keysyms.h
#   modifiers: shift, ctrl, mod1 (alt), mod3, mod4 (super), mod5
#   action:    unit form ("close_window") or payload table form
#              ({ adjust_window_width = -0.1 }); see README for the actions
#
# [[keybindings]]
# key = "q"
# modifiers = ["mod4"]
# action = "close_window"
#
# [[keybindings]]
# key = "minus"
# modifiers = ["mod4"]
# action = { adjust_window_width = -0.1 }
#
# [[keybindings]]
# key = "t"
# modifiers = ["mod4"]
# action = { spawn = ["alacritty"] }
#
# [[keybindings]]
# key = "1"
# modifiers = ["mod4"]
# action = { focus_workspace_number = 1 }
#
# Bare keys (no modifiers) only fire while the overview is open:
# [[keybindings]]
# key = "h"
# modifiers = []
# action = "overview_nav_left"

# Pointer bindings, same replace-not-merge rule. Defaults are mod4+left =
# move_window, mod4+right = resize_window.
#
#   button:    left, right, middle, side, extra
#   modifiers: as for keybindings; an empty list is the bare button, which is
#              what a touchpad gesture remapped to a mouse button needs
#
# [[pointer_bindings]]
# button = "middle"
# modifiers = []
# action = "move_window"
