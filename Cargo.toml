[package]
name = "flume"
description = "Tiny scrolling window manager for river"
license = "AGPL-3.0-or-later"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/codethare/flume"

[dependencies]
bitflags = "2.11.0"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
wayland-backend = "0.3.14"
wayland-client = "0.31.13"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-scanner = "0.31.9"
libc = "0.2"
xkbcommon = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
